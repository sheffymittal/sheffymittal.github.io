<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=Ta, initial-scale=1.0">
    <!-- Bootstrap v4 -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.1.3/dist/css/bootstrap.min.css"
        integrity="sha384-MCw98/SFnGE8fJT3GXwEOngsV7Zt27NXFoaoApmYm81iuXoPkFOJwJ8ERdknLPMO" crossorigin="anonymous">
    <title>Task List</title>
    <style>
        .jumbotron{
          background: url(https://ideascale.com/wp-content/uploads/2022/03/Task-Management-Advantages-scaled.jpg);
          background-position: center;
          background-repeat: no-repeat;
          background-size: cover;

        }
   #tasklist{
    margin-top: 30px;
   }

   .task-item{
    display:flex;
    justify-content: space-between;
    align-items: center;
    background-color: antiquewhite;
    padding: 10px;
    margin: 5px 0;
    border-radius: 5px ;
   }

   .task-item button{
    background-color: red;
    color:beige;
    border: none;
    padding: 5px 10px;
    cursor: pointer;
   }
    </style>
</head>
<body>
<!-- Jumbotron section -->
<div class="jumbotron text-center">
    <h1 class="display-4 text-danger font-weight-bold">Task Management</h1>
    <p class ="lead font-weight-bold">Keep Track of your tasks effortlessly!</p>
</div>

<!-- Task List Container -->
<div class="container" id="taskList">
    <div class="row justify-content-center">
        <div class="col-12 col-md-8">
            <div class="input-group">
                <input type = "text" class = " form-control" id ="taskInput"
placeholder="Add a New Task">
                <input type= "time" class = "form-control" id ="timeInput">
<div class="input-group-append">
    <button class="btn btn-primary mx-2" id ="addTaskBtn"> Add Task</button>
        </div>   
        </div>
        <ul id="taskListContainer" class ="list-unstyled mt-3">
            <!-- Task Items will be added here-->
        </ul>
        </div>
    </div>
</div>
<!--Bootstrap JS and JQuery-->
<script src="https://code.jquery.com/jquery-3.3.1.slim.min.js" integrity="sha384-q8i/X+965DzO0rT7abK41JStQIAqVgRVzpbzo5smXKp4YfRvH+8abtTE1Pi6jizo" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/popper.js@1.14.3/dist/umd/popper.min.js" integrity="sha384-ZMP7rVo3mIykV+2+9J3UJ46jBk0WLaUAdn689aCwoqbBJiSnjAK/l8WvCWPIPm49" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@4.1.3/dist/js/bootstrap.min.js" integrity="sha384-ChfqqxuZUCnJSK3+MXmPNIyE6ZbWh2IMqE241rYiqJxyMiZ6OW/JmZQ5stwEULTy" crossorigin="anonymous"></script>

<script src ="Time&Task_Project.js"></script>
    
</body>
</html>
